name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test NodeJS ${{ matrix.node_version }}

    strategy:
      matrix:
        node_version: [20, 22]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        if: github.event_name == 'pull_request'
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node_version: ${{ matrix.node_version }}

      - name: Test
        uses: ./.github/actions/test
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          chromatic_token: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  headless-browser-tests:
    runs-on: ubuntu-24.04
    name: Headless browser tests

    steps:
      - uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node_version: 22

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the headless browser tests
        run: pnpm test.pw.headless.ci

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dist/.playwright/packages/kit-headless
          retention-days: 7

  continuous-release:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node_version: 20
      - run: pnpm release.prepare --parallel=false
      - run: pnpm dlx pkg-pr-new publish --pnpm ./dist/packages/kit-headless ./dist/packages/kit-styled ./dist/packages/cli ./dist/packages/utils
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GITHUB_TOKEN is provided automatically in any repository


